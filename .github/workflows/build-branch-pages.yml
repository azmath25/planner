name: Build Dayframe React website for branch Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'scripts/**'
      - '.github/workflows/build-branch-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dayframe-main-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify feature parity source
        run: npm run test:source
      - name: Validate timer domain transitions
        run: npm run test:time
      - name: Type-check and build React website
        run: npm run build
      - name: Verify generated site and Pages path
        run: npm run check:dist
      - name: Publish compiled assets to main root
        run: |
          set -euo pipefail
          # Do not rebase a generated index.html over another Pages build:
          # it causes content conflicts and leaves the live site outdated.
          test -s dist/index.html
          test -d dist/assets
          test -s dist/sw.js
          for attempt in 1 2 3; do
            git fetch origin main
            # If newer frontend source exists, its own run must publish it.
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- web package.json package-lock.json vite.config.ts tsconfig.json scripts; then
              echo 'A newer frontend source commit exists; skipping stale compiled assets.'
              exit 0
            fi
            git reset --hard origin/main
            cp dist/index.html index.html
            cp dist/sw.js sw.js
            rm -rf assets
            cp -R dist/assets assets
            touch .nojekyll
            git rm -f --ignore-unmatch app.js styles.css || true
            git add -A -- index.html assets sw.js .nojekyll
            if git diff --cached --quiet; then
              echo 'No generated-site changes.'
              exit 0
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: refresh React preview on main [skip ci]'
            if git push origin HEAD:main; then
              echo 'Published compiled assets from current frontend source.'
              exit 0
            fi
            echo "Concurrent update during publish attempt $attempt; retrying from latest main."
          done
          echo 'Could not publish compiled assets after retries.' >&2
          exit 1
