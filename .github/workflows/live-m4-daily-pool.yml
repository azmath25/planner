name: Live Dayframe M4.1 Daily Pool Security
on:
  push:
    branches: [main]
    paths:
      - 'tests/live-m4-daily-pool.mjs'
      - '.github/workflows/live-m4-daily-pool.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/live-m4-daily-pool.mjs
