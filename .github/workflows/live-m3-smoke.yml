name: Live Dayframe M3 API security smoke
on:
  push:
    branches: [main]
    paths:
      - 'tests/live-m3-smoke.mjs'
      - '.github/workflows/live-m3-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deployed M3 API security
        run: node --test tests/live-m3-smoke.mjs
