name: Live Dayframe M4.2 Timed Interval Security
on:
  push:
    branches: [main]
    paths:
      - 'tests/live-m42-timed.mjs'
      - '.github/workflows/live-m42-timed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/live-m42-timed.mjs
