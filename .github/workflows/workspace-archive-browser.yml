name: Dayframe workspace archive browser smoke
on:
  push:
    branches: [main]
    paths:
      - 'tests/workspace-archive-browser.py'
      - 'tests/build-workspace-archive-harness.mjs'
      - '.github/workflows/workspace-archive-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: pip install playwright
      - run: python -m playwright install chromium --with-deps
      - run: python tests/workspace-archive-browser.py
